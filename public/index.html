<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NomoCase</title>
<style>
  :root { --fg: #1d2329; --muted: #6b7480; --line: #e3e6ea; --bg: #f6f7f9; --card: #fff; --accent: #2457d6; --warn: #c2410c; --ok: #15803d; font: 15px/1.45 system-ui, -apple-system, sans-serif; color: var(--fg); }
  body { margin: 0; background: var(--bg); }
  a { color: var(--accent); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
  header nav { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; color: var(--fg); text-decoration: none; }
  main { max-width: 1320px; margin: 0 auto; padding: 16px 20px 60px; }
  main.narrow { max-width: 640px; }
  h1 { font-size: 1.4rem; margin: .3em 0; }
  h2 { font-size: 1.1rem; margin: 1.4em 0 .5em; }
  h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1.3em 0 .5em; }
  h4 { margin: 1em 0 .2em; font-size: .95rem; }
  .muted { color: var(--muted); } .small { font-size: .85em; } .warn { color: var(--warn); }
  button { font: inherit; padding: 4px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; }
  input, select, textarea { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; max-width: 100%; box-sizing: border-box; }
  textarea { width: 100%; }
  textarea.code { font: 12px/1.4 ui-monospace, monospace; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  [hidden] { display: none !important; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stats div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
  .stats b { font-size: 1.4rem; display: block; }
  .stats .link-tile { cursor: pointer; } .stats .link-tile:hover { border-color: var(--accent); }
  .filters { gap: 8px; margin-bottom: 10px; } .filters input[type=search] { flex: 1 1 220px; } .filters .seg { margin-bottom: 0; flex-wrap: wrap; }
  .cards { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .cards a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: inherit; }
  .cards a:hover { border-color: var(--accent); }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .card .list li:last-child { border-bottom: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
  .card.next { border-color: var(--accent); }
  .cols { display: grid; grid-template-columns: 1.1fr 1.3fr 1fr; gap: 16px; align-items: start; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px 14px 14px; min-width: 0; }
  .tabs { display: none; }
  @media (max-width: 960px) {
    .cols { grid-template-columns: 1fr; }
    .tabs { display: flex; position: sticky; top: 0; z-index: 2; margin: 10px -16px 0; padding: 6px 16px; background: var(--bg); border-bottom: 1px solid var(--line); gap: 6px; }
    .tabs button { flex: 1; }
    .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cols > .col:not(.active) { display: none; }
    header { position: static; } /* the tab bar is the sticky element on small screens */
  }
  @media (max-width: 600px) {
    main { padding: 12px 16px 48px; }
    header { padding: 8px 16px; }
    header nav { gap: 10px; font-size: .9em; }
  }
  .tasks { list-style: none; padding: 0; margin: 0; }
  .task { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .task > div { flex: 1; min-width: 0; }
  .ico { width: 1.2em; text-align: center; font-weight: 700; flex: none; }
  .task.done .ico { color: var(--ok); }
  .task.open:not(.blocked) .ico { color: var(--accent); }
  .task.blocked { color: var(--muted); }
  .task.skipped b { text-decoration: line-through; color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: .8em; }
  .tools input { font-size: inherit; padding: 1px 4px; }
  .tag { font-size: .75em; padding: 1px 7px; border-radius: 10px; background: #eef1f5; white-space: nowrap; }
  .tag.internal { background: #fff3cd; } .tag.approved { background: #dcfce7; } .tag.rejected { background: #fee2e2; }
  .timeline { list-style: none; padding: 0; margin: 0 0 10px; }
  .ev { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .ev p { margin: 4px 0 0; white-space: pre-wrap; }
  .ev.comment p { background: #f1f5ff; padding: 6px 9px; border-radius: 6px; }
  .doc { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .versions { margin: 4px 0; padding-left: 22px; font-size: .9em; }
  .versions li.current a { font-weight: 600; }
  .hash { font-family: ui-monospace, Menlo, monospace; font-size: .8em; word-break: break-all; }
  .verify output { display: block; margin-top: 4px; }
  .sig { font-size: .82em; color: var(--muted); } .sig.known, .sig.trusted { color: inherit; } .sig.changed, .sig.invalid { color: var(--warn); }
  details.add > summary { cursor: pointer; color: var(--accent); font-size: .9em; margin: 6px 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  .revoked { opacity: .5; }
  details.claim { padding: 8px 0; border-bottom: 1px solid var(--line); }
  details.claim > summary { cursor: pointer; list-style: none; }
  details.claim form { margin-top: 6px; }
  dl.totals { margin-top: 10px; }
  dl.totals dd { text-align: right; }
  .block { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; }
  .push { margin-left: auto; }
  summary { cursor: pointer; }
  details.inline > summary, details.menu > summary { list-style: none; }
  details.inline > summary::-webkit-details-marker, details.menu > summary::-webkit-details-marker { display: none; }
  details.inline > summary.btn { display: inline-block; padding: 4px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  details.inline > summary.btn:hover { border-color: var(--accent); }
  details.inline[open] { flex-basis: 100%; }
  details.inline form { margin-top: 6px; }
  details.menu { position: relative; flex: none; }
  details.menu > summary { padding: 0 6px; color: var(--muted); font-weight: 700; }
  .menu-body { position: absolute; right: 0; top: 1.5em; z-index: 3; min-width: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .08); }
  .result { margin-top: 4px; }
  .rounds { margin: 4px 0 0; padding-left: 18px; }
  .ask { margin: 8px 0; padding: 6px 9px; background: #fff7e6; border-left: 3px solid #f0b34a; border-radius: 4px; }
  .phases { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; font-size: .85em; }
  .phases span { padding: 2px 9px; border-radius: 10px; background: #eef1f5; color: var(--muted); }
  .phases span.on { background: var(--accent); color: #fff; }
  .state::before { content: "●"; margin-right: 6px; color: var(--muted); }
  .state.mine::before { color: var(--accent); }
  .state.late::before { color: var(--warn); }
  .state.wait::before { color: #d4a017; }
  .state.done::before { color: var(--ok); }
  .seg { display: inline-flex; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  button.danger { color: #b42318; border-color: #f1c7c3; }
  button.danger:hover { border-color: #b42318; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; font-weight: 600; }
  .banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 20px; background: #fff7e6; border-bottom: 1px solid #f3dcae; font-size: .9em; }
  .banner.fresh { position: sticky; top: 0; z-index: 5; background: #e8f0fe; border-color: #c6d7f7; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
