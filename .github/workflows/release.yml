# Tag v* (scripts/release.sh): the whole suite on a macOS runner (Chrome and system font as on the development Mac;
# Linux's wider fallback font makes the case page overflow a phone), and only when it is
# green the release with the package nomo-ops deploys (nomocase-<version>.tar.gz, SHA256SUMS). "Run workflow": the
# suite alone, no release.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency: release
jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the suite runs locally (wrangler dev, local D1) as in the README's setup: the example config and the dev login
      # (never deployed); the instance's own config stays out of git
      - run: cp wrangler.example.jsonc wrangler.jsonc && printf 'DEV_LOGIN=1\nORIGIN=http://localhost:8787\nREDIRECT_HOSTS=\n' > .dev.vars
      - run: npm test
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir out
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "out/nomocase-$V.tar.gz" src public migrations templates scripts package.json package-lock.json wrangler.example.jsonc LICENSE.md COMMERCIAL.md
          (cd out && shasum -a 256 -- * > SHA256SUMS)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "nomocase ${GITHUB_REF_NAME#v}" --notes "Built after a green suite; deployed by nomo-ops."
